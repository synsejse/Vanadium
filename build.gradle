plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.terraformersmc:modmenu:20.0.2"
    implementation "com.google.code.findbugs:jsr305:3.0.2"

    api("me.shedaniel.cloth:cloth-config-fabric:26.2.155") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // MixinSquared API for our C2ME-compat MixinCanceller; provided at runtime by C2ME, so compileOnly.
    compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.3"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version

    // Captured outside the closure: referencing `project` at execution time breaks the configuration cache.
    def modVersion = project.version
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    // Minecraft 26.2 is unobfuscated: jar and sourcesJar are the distributable artifacts.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

tasks.register('blockUpdateChecksJar', Jar) {
    group = 'verification'
    description = 'Packages the live block-update and dirty-chunk regression checks'
    dependsOn 'testClasses'
    archiveFileName = 'block-update-checks.jar'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
    from(sourceSets.test.output) {
        include 'com/synsenetwork/vanadium/integration/BlockUpdateChecks*.class'
    }
    from('src/test/resources/block-update-checks.fabric.mod.json') {
        rename { 'fabric.mod.json' }
    }
}

// Runtime mods for the dev server (C2ME — required by fabric.mod.json — spark, etc.) are NOT
// managed by Gradle: Loom can't unpack C2ME's 15 nested JiJ mods onto the dev classpath, so any
// Gradle-side mechanism is a workaround. Drop the release jars into run/mods yourself;
// Fabric Loader loads their nested jars there exactly like a production install.
tasks.register('benchScheduler', JavaExec) {
    group = 'verification'
    description = 'Runs the scheduler micro-benchmark (SchedulerBench)'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.synsenetwork.vanadium.bench.SchedulerBench'
    jvmArgs = ['-XX:+UseParallelGC']
}

tasks.register('benchWorkerPool', JavaExec) {
    group = 'verification'
    description = 'Compares small, large, balanced and uneven worker waves'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.synsenetwork.vanadium.bench.WorkerPoolBench'
    jvmArgs = ['-XX:+UseParallelGC']
}

tasks.register('benchAreaMap', JavaExec) {
    group = 'verification'
    description = 'Measures tracking-area moves, teleports and radius changes'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.synsenetwork.vanadium.bench.AreaMapBench'
    jvmArgs = ['-XX:+UseParallelGC']
}

loom {
    accessWidenerPath = file("src/main/resources/vanadium.accesswidener")
    runs {
        server {
            runDir = providers.gradleProperty('vanadiumRunDir').getOrElse('run')
        }
    }
}

def archiveBaseName = project.archives_base_name

jar {
    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
}
