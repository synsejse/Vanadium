# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Loom finalizes live launch directories during configuration; each run needs a fresh path.
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/use
minecraft_version=26.3
loom_version=1.17.12
loader_version=0.20.1

# Mod Properties
mod_version = 2.1.0+26.3
maven_group = com.synsenetwork
archives_base_name = vanadium

# Dependencies
# currently not on the main fabric site, check on the maven: https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api
fabric_version=0.165.2+26.3
fabric_kotlin_version=1.14.2+kotlin.2.4.21
cloth_config_version=26.3.159
jctools_version=4.0.7

