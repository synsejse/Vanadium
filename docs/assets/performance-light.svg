<text x="920" y="260.4" text-anchor="end" fill="#71717a" font-size="11">20 TPS</text>
<path d="M536 192.8 L632 179.5 L728 176 L776 171.8 L920 184.9" fill="none" stroke="#1b4ed8" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="536" cy="192.8" r="4" fill="#1b4ed8" stroke="#ffffff" stroke-width="2"/>
<text x="536" y="180.8" text-anchor="middle" fill="#18181b" font-size="12" font-weight="600">63.8</text>
<text x="536" y="322" text-anchor="middle" fill="#71717a" font-size="12">16</text>
<circle cx="632" cy="179.5" r="4" fill="#1b4ed8" stroke="#ffffff" stroke-width="2"/>
<text x="632" y="167.5" text-anchor="middle" fill="#18181b" font-size="12" font-weight="600">71.7</text>
<text x="632" y="322" text-anchor="middle" fill="#71717a" font-size="12">24</text>
<circle cx="728" cy="176" r="4" fill="#1b4ed8" stroke="#ffffff" stroke-width="2"/>
