<text x="728" y="322" text-anchor="middle" fill="#71717a" font-size="12">32</text>
<circle cx="776" cy="171.8" r="4" fill="#1b4ed8" stroke="#ffffff" stroke-width="2"/>
<text x="776" y="159.8" text-anchor="middle" fill="#18181b" font-size="12" font-weight="600">76.3</text>
<text x="776" y="322" text-anchor="middle" fill="#71717a" font-size="12">36</text>
<circle cx="920" cy="184.9" r="4" fill="#1b4ed8" stroke="#ffffff" stroke-width="2"/>
<text x="920" y="172.9" text-anchor="middle" fill="#18181b" font-size="12" font-weight="600">68.5</text>
<text x="920" y="322" text-anchor="middle" fill="#71717a" font-size="12">48</text>
<text x="728" y="342" text-anchor="middle" fill="#71717a" font-size="12">workers</text>
<text x="32" y="376" fill="#71717a" font-size="12">Historical single runs from separate experiments; “off” keeps Vanadium’s structural changes. Not a vanilla comparison.</text>
</g></svg>
