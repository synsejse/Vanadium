<title id="title">Vanadium worker scaling on Minecraft 26.3</title>
<desc id="desc">Uncapped ticks per second by worker count, three workloads. Spread out: Lithium alone 20.8 TPS; with Vanadium 2 workers 50 TPS, 4 workers 74 TPS, 8 workers 103 TPS, 16 workers 162 TPS, 24 workers 193 TPS, 32 workers 211 TPS, 48 workers 220 TPS, 64 workers 196 TPS, 72 workers 126 TPS. Crowded base: Lithium alone 119 TPS; with Vanadium 2 workers 237 TPS, 4 workers 389 TPS, 8 workers 566 TPS, 16 workers 782 TPS, 24 workers 945 TPS, 32 workers 933 TPS, 48 workers 850 TPS, 64 workers 736 TPS, 72 workers 333 TPS. Combat: Lithium alone 25.2 TPS; with Vanadium 2 workers 54.6 TPS, 4 workers 79.6 TPS, 8 workers 122 TPS, 16 workers 163 TPS, 24 workers 175 TPS, 32 workers 152 TPS, 48 workers 87.6 TPS, 64 workers 95.8 TPS, 72 workers 108 TPS.</desc>
