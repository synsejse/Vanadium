<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Vanadium throughput and worker scaling (Minecraft 26.2)</title>
<desc id="desc">Minecraft 26.2, dual Xeon E5-2699 v3 VM, 4096 AI zombies in 1024 chunks, no players. At 32 workers: off 7.6 TPS, on 81.3 TPS. Worker sweep: 16 workers 63.8, 24 workers 71.7, 32 workers 73.8, 36 workers 76.3, 48 workers 68.5 TPS. Separate experiments; off keeps structural changes.</desc>
<rect x=".5" y=".5" width="959" height="399" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-opacity="1"/>
<g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="32" y="44" fill="#18181b" font-size="17" font-weight="600">Throughput and worker scaling</text>
<text x="32" y="68" fill="#71717a" font-size="13">Minecraft 26.2 · dual Xeon E5-2699 v3 VM · 4,096 AI zombies · 1,024 chunks · uncapped TPS</text>
<text x="32" y="114" fill="#18181b" font-size="14" font-weight="600">Parallel ticking, 32 workers</text>
<path d="M32 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="32" y="322" text-anchor="middle" fill="#71717a" font-size="12">0</text>
<path d="M110.4 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="110.4" y="322" text-anchor="middle" fill="#71717a" font-size="12">20</text>
<path d="M188.8 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="188.8" y="322" text-anchor="middle" fill="#71717a" font-size="12">40</text>
<path d="M267.2 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="267.2" y="322" text-anchor="middle" fill="#71717a" font-size="12">60</text>
<path d="M345.6 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="345.6" y="322" text-anchor="middle" fill="#71717a" font-size="12">80</text>
<path d="M424 132V300" stroke="#18181b" stroke-opacity=".07"/>
<text x="424" y="322" text-anchor="middle" fill="#71717a" font-size="12">100</text>
<text x="32" y="150" fill="#71717a" font-size="13">Off</text>
<rect x="32" y="160" width="29.8" height="26" rx="4" fill="#d4d4d8"/>
<text x="71.8" y="178" fill="#18181b" font-size="14" font-weight="600">7.6</text>
<text x="32" y="222" fill="#71717a" font-size="13">On</text>
<rect x="32" y="232" width="318.7" height="26" rx="4" fill="#1b4ed8"/>
<text x="360.7" y="250" fill="#18181b" font-size="14" font-weight="600">81.3</text>
<text x="512" y="114" fill="#18181b" font-size="14" font-weight="600">Worker scaling</text>
<path d="M536 300H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="304" text-anchor="end" fill="#71717a" font-size="12">0</text>
<path d="M536 266.4H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="270.4" text-anchor="end" fill="#71717a" font-size="12">20</text>
<path d="M536 232.8H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="236.8" text-anchor="end" fill="#71717a" font-size="12">40</text>
<path d="M536 199.2H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="203.2" text-anchor="end" fill="#71717a" font-size="12">60</text>
<path d="M536 165.6H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="169.6" text-anchor="end" fill="#71717a" font-size="12">80</text>
<path d="M536 132H920" stroke="#18181b" stroke-opacity=".07"/>
<text x="524" y="136" text-anchor="end" fill="#71717a" font-size="12">100</text>
