<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc">
<title id="title">Vanadium 26.3 worker scaling and adaptive-region comparison</title>
<desc id="desc">Minecraft 26.3. Fixed-grid worker sweep: 2 helpers 29.3 TPS; 4 helpers 43.6 TPS; 8 helpers 63.3 TPS; 16 helpers 93.4 TPS; 24 helpers 112.2 TPS; 32 helpers 119.1 TPS; 36 helpers 114.1 TPS; 48 helpers 99.8 TPS; 64 helpers 85.9 TPS. Separate 32-helper A/B: uniform fixed 120.4, adaptive 120.4 TPS; clustered fixed 82.2, adaptive 91.5 TPS. Scaling is from before adaptive regions, not the current scheduler. No vanilla comparison.</desc>
