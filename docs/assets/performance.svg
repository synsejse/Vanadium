<svg xmlns="http://www.w3.org/2000/svg" width="960" height="546" viewBox="0 0 960 546" role="img" aria-labelledby="title desc">
<title id="title">Vanadium: historical throughput and worker scaling</title>
<desc id="desc">Minecraft 26.2, dual Xeon E5-2699 v3 VM, 4096 AI zombies in 1024 chunks, no players. Separate experiments. At 32 helpers: off 7.6 TPS, on 81.3. Worker sweep: 16 helpers 63.8, 24 helpers 71.7, 32 helpers 73.8, 36 helpers 76.3, 48 helpers 68.5 TPS. Off retains structural changes. No 26.3 or vanilla comparison.</desc>
